{% extends "posts/base.html" %}

{% block title %}Iniciar sesión | Sillage{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8 col-lg-5">

        <div class="post-card p-4 p-md-5">

            <h1 class="gold-text text-center mb-3">
                Iniciar sesión
            </h1>

            <p class="text-secondary text-center mb-4">
                Bienvenido nuevamente a Sillage.
            </p>

            <form method="POST">

                {% csrf_token %}

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Usuario o contraseña incorrectos.
                    </div>
                {% endif %}

                <div class="mb-3">

                    <label
                        for="id_username"
                        class="form-label"
                    >
                        Nombre de usuario
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        class="form-control"
                        value="{{ form.username.value|default_if_none:'' }}"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label
                        for="id_password"
                        class="form-label"
                    >
                        Contraseña
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        class="form-control"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <input
                    type="hidden"
                    name="next"
                    value="{{ next }}"
                >

                <button
                    type="submit"
                    class="btn btn-gold w-100 mt-3"
                >
                    Iniciar sesión
                </button>

            </form>

            <p class="text-center text-secondary mt-4 mb-0">
                ¿Todavía no tenés cuenta?

                <a
                    href="{% url 'usuarios:registro' %}"
                    class="gold-text text-decoration-none"
                >
                    Registrate
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
