<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sillage{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #101010;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #181818;
            border-bottom: 1px solid #b99b5b;
        }

        .navbar-brand {
            color: #d4af37 !important;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .nav-link {
            color: #f5f5f5 !important;
        }

        .nav-link:hover {
            color: #d4af37 !important;
        }

        .post-card {
            background-color: #1c1c1c;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .post-card:hover {
            transform: translateY(-5px);
        }

        .post-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .post-placeholder {
            height: 250px;
            background-color: #292929;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #b99b5b;
            font-size: 1.2rem;
        }

        .gold-text {
            color: #d4af37;
        }

        .btn-gold {
            background-color: #d4af37;
            color: #101010;
            font-weight: bold;
        }

        .btn-gold:hover {
            background-color: #b99b5b;
            color: #101010;
        }

        footer {
            margin-top: 80px;
            padding: 25px;
            background-color: #181818;
            border-top: 1px solid #333;
            text-align: center;
            color: #aaa;
        }
        
        /* Sección de bienvenida */

        .hero-section {
            padding: 65px 25px;
            background: linear-gradient(
                135deg,
                #202020,
                #101010
            );
            border: 1px solid #333;
            border-radius: 16px;
        }

        .hero-section h1 {
            color: #f5f5f5;
            letter-spacing: 1px;
        }

        .hero-section .gold-text {
            letter-spacing: 3px;
            font-size: 0.85rem;
        }

        /* Formularios */

        .form-control,
        .form-select {
            background-color: #252525;
            color: #f5f5f5;
            border: 1px solid #444;
            padding: 12px;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #252525;
            color: #fff;
            border-color: #d4af37;
            box-shadow: 0 0 0 0.2rem rgba(212, 175, 55, 0.15);
        }

        .form-control::placeholder {
            color: #999;
        }

        .form-select option {
            background-color: #252525;
            color: #fff;
        }

        /* Tarjetas de publicaciones */

        .post-card {
            background-color: #1c1c1c;
            border: 1px solid #333;
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }

        .post-card:hover {
            transform: translateY(-5px);
            border-color: #b99b5b;
        }

        .post-image {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .post-placeholder {
            height: 260px;
            background: linear-gradient(135deg, #292929, #181818);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #b99b5b;
        }

        /* Estado sin resultados */

        .empty-state {
            background-color: #1c1c1c;
            border: 1px dashed #555;
            border-radius: 14px;
            padding: 40px;
        }

        /* Adaptación para celulares */

        @media (max-width: 768px) {
            .hero-section {
                padding: 40px 20px;
            }

            .hero-section h1 {
                font-size: 2rem;
            }

            .post-image,
            .post-placeholder {
                height: 220px;
            }
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="{% url 'posts:lista_posts' %}">
                SILLAGE
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Abrir menú"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'posts:lista_posts' %}"
                        >
                            Inicio
                        </a>
                    </li>

                    {% if user.is_authenticated %}

                        <li class="nav-item ms-lg-3">
                            <a
                                class="btn btn-gold"
                                href="{% url 'posts:crear_post' %}"
                            >
                                + Nueva publicación
                            </a>
                        </li>

                        <li class="nav-item ms-lg-3">
                            <span class="nav-link">
                                Hola, {{ user.username }}
                            </span>
                        </li>

                        <li class="nav-item ms-lg-3">

                            <form
                                method="POST"
                                action="{% url 'usuarios:logout' %}"
                                class="m-0"
                            >
                                {% csrf_token %}

                                <button
                                    type="submit"
                                    class="btn btn-outline-light"
                                >
                                    Cerrar sesión
                                </button>

                            </form>

                        </li>

                    {% else %}

                        <li class="nav-item ms-lg-3">
                            <a
                                class="nav-link"
                                href="{% url 'usuarios:login' %}"
                            >
                                Iniciar sesión
                            </a>
                        </li>

                        <li class="nav-item ms-lg-3">
                            <a
                                class="btn btn-gold"
                                href="{% url 'usuarios:registro' %}"
                            >
                                Registrarse
                            </a>
                        </li>

                    {% endif %}

                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1">

        {% block content %}
        {% endblock %}

    </main>

    <footer>
        <p class="mb-0">
            © Sillage - Historias detrás de cada fragancia
        </p>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>
</html>
